<svg xmlns="http://www.w3.org/2000/svg" viewBox="-200 40 340 220" width="340" height="220">
  <!-- Lettuce Conquer: Pea Shooter (skirmisher), idle. Feet anchor at (0, 248).
       Team key color #3a7bd5 (swapped per team at load). Inline attributes only: pygame/nanosvg
       ignores CSS and text. -->
  <g>
    <ellipse cx="0" cy="248" rx="58" ry="8" fill="#000" opacity="0.12"/>
    <line x1="-20" y1="212" x2="-26" y2="242" stroke="#2b2118" stroke-width="12" stroke-linecap="round"/>
    <line x1="-20.0" y1="212.0" x2="-26" y2="242" stroke="#6cb23e" stroke-width="7" stroke-linecap="round"/>
    <ellipse cx="-28" cy="246" rx="11" ry="5.5" fill="#4f8f2b" stroke="#2b2118" stroke-width="2.5"/>
    <line x1="14" y1="206" x2="18" y2="242" stroke="#2b2118" stroke-width="12" stroke-linecap="round"/>
    <line x1="14.0" y1="206.0" x2="18" y2="242" stroke="#6cb23e" stroke-width="7" stroke-linecap="round"/>
    <ellipse cx="20" cy="246" rx="11" ry="5.5" fill="#4f8f2b" stroke="#2b2118" stroke-width="2.5"/>
    <g transform="rotate(-18 0 190)">
      <!-- curly stem + sepals -->
      <path d="M-74 194 Q-92 194 -96 178 Q-98 168 -90 166" stroke="#4f8f2b" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M-72 194 L-88 184 L-80 196 L-90 204 L-76 200 L-80 212 L-68 198 Z" fill="#4f8f2b" stroke-width="2" stroke="#2b2118" stroke-linejoin="round" stroke-linecap="round"/>
      <!-- lumpy pod -->
      <path d="M-72 194 Q-62 176 -46 178 Q-34 168 -22 177 Q-8 166 4 172 Q24 156 44 170 Q58 174 72 166 Q68 182 56 190 Q42 208 20 207 Q-8 211 -20 205 Q-36 210 -48 203 Q-62 205 -72 194 Z" fill="#6cb23e" stroke="#2b2118" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M-63 182 Q-57 176 -49 177 L-49 204 Q-56 206 -63 201 Z" fill="#3a7bd5" stroke="#2b2118" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M-62 198 Q-40 204 -20 200 Q10 204 40 196 Q54 190 64 176" stroke="#4f8f2b" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <circle cx="-34" cy="190" r="13" fill="#a6dd6a" stroke-width="2" stroke="#2b2118" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="-8" cy="188" r="13" fill="#a6dd6a" stroke-width="2" stroke="#2b2118" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M-38 184 Q-36 181 -32 181 M-12 182 Q-10 179 -6 179" stroke="#d2f0a8" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <!-- front pea with face -->
      <circle cx="24" cy="186" r="20" fill="#a6dd6a" stroke="#2b2118" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
      <ellipse cx="17" cy="182" rx="5" ry="6.5" fill="#fff" stroke-width="1.5" stroke="#2b2118" stroke-linejoin="round" stroke-linecap="round"/>
      <ellipse cx="31" cy="182" rx="5" ry="6.5" fill="#fff" stroke-width="1.5" stroke="#2b2118" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="18.5" cy="184" r="2.6" fill="#2b2118"/>
      <circle cx="32.5" cy="184" r="2.6" fill="#2b2118"/>
      <ellipse cx="25" cy="196" rx="4" ry="3" fill="#2b2118"/>
      <!-- team bandana -->
      <path d="M2 180 Q24 150 46 176 L44 184 Q24 158 4 188 Z" stroke-width="2" fill="#3a7bd5" stroke="#2b2118" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M8 176 L-2 150 L4 168 L-14 158 Z" stroke-width="2" fill="#3a7bd5" stroke="#2b2118" stroke-linejoin="round" stroke-linecap="round"/>
    </g>
    <!-- a flying pea -->
    <circle cx="98" cy="150" r="7" fill="#a6dd6a" stroke-width="2" stroke="#2b2118" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M86 154 L72 158 M86 148 L74 146" stroke="#6b5a48" stroke-width="2"/>
    <!-- stem feet -->
  </g>
</svg>
