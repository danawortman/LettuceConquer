[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lettuce-conquer"
version = "0.1.0"
description = "Lettuce Conquer: Leaf No One Behind - an educational vegetable RTS built on pygame-ce."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["pygame-ce>=2.5"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
lettuce-conquer = "lettuce_conquer.game.app:main"
lettuce-conquer-demo = "lettuce_conquer.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lettuce_conquer = ["assets/units/*.svg", "assets/buildings/*.svg", "assets/terrain/*.svg", "trees/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
